syntax = "proto3";

package tieba;

message PbContent {
  int32 type = 1;
  string text = 2;
  string link = 3;
  string src = 4;
  string bsize = 5;
  string bigSrc = 6;
  string cdnSrc = 8;
  string bigCdnSrc = 9;
  string c = 11;
  string voiceMD5 = 12;
  uint32 duringTime = 13;
  int64 uid = 15;
  string dynamic = 16;
  uint32 width = 18;
  uint32 height = 19;
  string originSrc = 25;
  uint32 originSize = 27;
  uint32 showOriginalBtn = 35;
  string cdnSrcActive = 36;
}
