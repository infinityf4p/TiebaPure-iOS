syntax = "proto3";

package tieba;

// Project-maintained projection of fields emitted by TiebaPure. Field numbers
// are wire identifiers and must only change with a matching fixture update.
message CommonRequest {
  int32 _client_type = 1;
  string _client_version = 2;
  string _client_id = 3;
  string from = 6;
  string cuid = 7;
  int64 _timestamp = 8;
  string model = 9;
  optional string BDUSS = 10;
  optional string tbs = 11;
  int32 net_type = 12;
  string pversion = 24;
  string _os_version = 25;
  string brand = 26;
  optional string stoken = 30;
  string cuid_galaxy2 = 32;
  optional string cuid_gid = 33;
  int32 scr_w = 37;
  int32 scr_h = 38;
  double scr_dip = 39;
  optional int32 q_type = 40;
  optional int32 is_teenager = 41;
  string user_agent = 62;
  int32 personalized_rec_switch = 63;
}
