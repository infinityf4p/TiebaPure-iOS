name: TiebaPure
options:
  minimumXcodeGenVersion: 2.45.0
  bundleIdPrefix: dev.infinityf4p
  deploymentTarget:
    iOS: "18.0"
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.38.1
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
targets:
  TiebaPure:
    type: application
    platform: iOS
    sources:
      - TiebaPure
      - path: LICENSE
        buildPhase: resources
      - path: LICENSES/SwiftProtobuf-Apache-2.0.txt
        buildPhase: resources
    resources:
      - TiebaPure/Resources/Assets.xcassets
      - TiebaPure/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - target: TiebaPureOpenIn
        embed: true
      - package: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.infinityf4p.tiebapure
        INFOPLIST_FILE: TiebaPure/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.4.5
        CURRENT_PROJECT_VERSION: 49
  TiebaPureOpenIn:
    type: app-extension
    platform: iOS
    sources:
      - path: TiebaPureOpenIn
        excludes:
          - Info.plist
          - OpenInTiebaPure.js
      - path: TiebaPure/App/ExternalRoute.swift
      - path: TiebaPure/App/SafariActionPayload.swift
      - path: TiebaPureOpenIn/OpenInTiebaPure.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.infinityf4p.tiebapure.open-in
        INFOPLIST_FILE: TiebaPureOpenIn/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: 1.4.5
        CURRENT_PROJECT_VERSION: 49
  TiebaPureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TiebaPureTests
    dependencies:
      - target: TiebaPure
      - package: SwiftProtobuf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TiebaPureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TiebaPureUITests
    dependencies:
      - target: TiebaPure
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TiebaPure:
    build:
      targets:
        TiebaPure: all
        TiebaPureTests: [test]
        TiebaPureUITests: [test]
    test:
      targets:
        - TiebaPureTests
        - TiebaPureUITests
